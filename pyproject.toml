[project]
name = "asu-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Arizona State University's public data - live class search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "asu", "class-search", "university"]
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.28.1",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/Vihaan004/asu-mcp"
Issues = "https://github.com/Vihaan004/asu-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
asu-mcp = "asu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
