[project]
name = "asu-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Arizona State University's public data - live class search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "asu", "class-search", "university"]
dependencies = [
    # The upper bound is load-bearing, not caution. mcp 2.0 removed
    # mcp.server.fastmcp entirely (FastMCP moved to mcp.server.mcpserver), so
    # an unpinned install resolves to 2.x and the server dies on import before
    # it can serve anything. uv.lock hid this during development for as long
    # as nobody installed fresh; the first person to install after 2.0 shipped
    # got a connector that would not start. Lift this with a real migration,
    # not by widening the range.
    "mcp[cli]>=1.28,<2",
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/Vihaan004/asu-mcp"
Issues = "https://github.com/Vihaan004/asu-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
asu-mcp = "asu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
